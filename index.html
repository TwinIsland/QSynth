    <html lang=EN-us>

    <head>
        <meta charset=utf-8>
        <meta content="text/html; charset=utf-8" http-equiv=Content-Type>
        <title>QSynth - Advanced Audio Synthesizer</title>
        <meta content="QSynth - Advanced Audio Synthesizer" name=title>
        <meta content="QSynth: Professional-grade audio synthesizer built with C and WebAssembly" name=description>
        <meta content="synthesizer, audio, music, QSynth, WebAssembly, C, raylib" name=keywords>
        <meta content="width=device-width,initial-scale=1" name=viewport>
        <meta content="Huang Tianyi (tianyih@u.nus.edu)" name=author>
        <meta content=website property=og:type>
        <meta content="QSynth - Advanced Audio Synthesizer" property=og:title>
        <meta content=QSynth property=og:site_name>
        <meta content="Professional-grade audio synthesizer built with C and WebAssembly" property=og:description>
        <link
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎹</text></svg>"
            rel="shortcut icon">
        <script src="coi-serviceworker.min.js"></script>
        <style>
            @import url(https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap);

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box
            }

            :root {
                --bg-primary: #0a0a0f;
                --bg-secondary: #1a1a2e;
                --bg-tertiary: #16213e;
                --accent: #00d4ff;
                --accent-glow: rgba(0, 212, 255, 0.3);
                --text-primary: #ffffff;
                --text-secondary: #b8bcc8;
                --text-muted: #6c7293;
                --border: rgba(255, 255, 255, 0.1);
                --shadow: rgba(0, 0, 0, 0.5)
            }

            body {
                background: linear-gradient(135deg, var(--bg-primary) 0, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
                color: var(--text-primary);
                font-family: Inter, sans-serif;
                min-height: 100vh;
                overflow: hidden;
                position: relative
            }

            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: linear-gradient(rgba(0, 212, 255, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .03) 1px, transparent 1px);
                background-size: 50px 50px;
                animation: grid-move 20s linear infinite;
                pointer-events: none;
                z-index: 0
            }

            @keyframes grid-move {
                0% {
                    transform: translate(0, 0)
                }

                100% {
                    transform: translate(50px, 50px)
                }
            }

            .container {
                position: relative;
                z-index: 1;
                height: 100vh;
                display: flex;
                flex-direction: column
            }

            .header {
                background: rgba(26, 26, 46, .9);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid var(--border);
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 2px 20px var(--shadow)
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 1rem
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                background: linear-gradient(45deg, var(--accent), #7c3aed);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                box-shadow: 0 0 20px var(--accent-glow)
            }

            .logo-text h1 {
                font-family: 'JetBrains Mono', monospace;
                font-size: 1.8rem;
                font-weight: 700;
                background: linear-gradient(45deg, var(--accent), #7c3aed);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin: 0
            }

            .logo-text .tagline {
                font-size: .8rem;
                color: var(--text-muted);
                font-family: 'JetBrains Mono', monospace;
                margin-top: -2px
            }

            .author-info {
                text-align: right;
                font-family: 'JetBrains Mono', monospace
            }

            .author-name {
                font-size: .9rem;
                color: var(--text-secondary);
                font-weight: 500
            }

            .author-details {
                font-size: .75rem;
                color: var(--text-muted);
                margin-top: 2px
            }

            .github-link {
                color: var(--accent);
                text-decoration: none;
                transition: all .3s ease
            }

            .github-link:hover {
                color: #fff;
                text-shadow: 0 0 10px var(--accent-glow)
            }

            .main-content {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 2rem;
                position: relative
            }

            .canvas-container {
                background: rgba(22, 33, 62, .8);
                backdrop-filter: blur(10px);
                border-radius: 16px;
                border: 1px solid var(--border);
                box-shadow: 0 20px 40px var(--shadow), 0 0 0 1px rgba(255, 255, 255, .05), inset 0 1px 0 rgba(255, 255, 255, .1);
                padding: 1.5rem;
                position: relative;
                overflow: hidden
            }

            .canvas-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--accent), transparent);
                animation: pulse 2s ease-in-out infinite alternate
            }

            @keyframes pulse {
                0% {
                    opacity: .3
                }

                100% {
                    opacity: 1
                }
            }

            canvas.emscripten {
                border: none;
                border-radius: 8px;
                background-color: #000;
                display: block;
                box-shadow: 0 10px 30px rgba(0, 0, 0, .7)
            }

            .status-indicator {
                position: absolute;
                top: 1rem;
                right: 1rem;
                display: flex;
                align-items: center;
                gap: .5rem;
                background: rgba(0, 0, 0, .7);
                padding: .5rem 1rem;
                border-radius: 20px;
                font-family: 'JetBrains Mono', monospace;
                font-size: .8rem;
                border: 1px solid var(--border)
            }

            .status-dot {
                width: 8px;
                height: 8px;
                background: var(--accent);
                border-radius: 50%;
                animation: blink 2s infinite
            }

            @keyframes blink {

                0%,
                50% {
                    opacity: 1
                }

                100%,
                51% {
                    opacity: .3
                }
            }

            .loading-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(10, 10, 15, .95);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 10;
                transition: opacity .5s ease
            }

            .loading-spinner {
                width: 60px;
                height: 60px;
                border: 2px solid var(--border);
                border-top: 2px solid var(--accent);
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 1rem
            }

            @keyframes spin {
                0% {
                    transform: rotate(0)
                }

                100% {
                    transform: rotate(360deg)
                }
            }

            .loading-text {
                font-family: 'JetBrains Mono', monospace;
                color: var(--text-secondary);
                font-size: .9rem
            }

            #output {
                position: absolute;
                bottom: 2rem;
                left: 2rem;
                right: 2rem;
                height: 120px;
                background: rgba(0, 0, 0, .8);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1rem;
                font-family: 'JetBrains Mono', monospace;
                font-size: .8rem;
                color: var(--text-secondary);
                overflow-y: auto;
                resize: none;
                backdrop-filter: blur(10px);
                display: none
            }

            @media (max-width:768px) {
                .header {
                    padding: 1rem;
                    flex-direction: column;
                    gap: 1rem;
                    text-align: center
                }

                .author-info {
                    text-align: center
                }

                .main-content {
                    padding: 1rem
                }

                .canvas-container {
                    padding: 1rem
                }

                .logo-text h1 {
                    font-size: 1.5rem
                }
            }
        </style>
        <script src=https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js></script>
        <script>function saveFileFromMEMFSToDisk(e, a) { var i, o = FS.readFile(e); i = new Blob([o.buffer], { type: "application/octet-binary" }), saveAs(i, a) }</script>
    </head>

    <body>
        <div class=container>
            <header class=header>
                <div class=logo>
                    <div class=logo-icon>🎹</div>
                    <div class=logo-text>
                        <h1>QSynth</h1>
                        <div class=tagline>Advanced Audio Synthesizer</div>
                    </div>
                </div>
                <div class=author-info>
                    <div class=author-name>Huang Tianyi</div>
                    <div class=author-details>tianyih@u.nus.edu | <a class=github-link
                            href=https://github.com/TwinIsland/QSynth target=_blank>GitHub</a></div>
                </div>
            </header>
            <main class=main-content>
                <div class=canvas-container>
                    <div class=status-indicator>
                        <div class=status-dot></div><span>ACTIVE</span>
                    </div>
                    <div class=loading-overlay id=loadingOverlay>
                        <div class=loading-spinner></div>
                        <div class=loading-text>Initializing QSynth...</div>
                    </div><canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
                </div>
            </main>
        </div><textarea id=output readonly></textarea>
        <script>var Module = { print: function () { var e = document.getElementById("output"); return e && (e.value = ""), function (t) { arguments.length > 1 && (t = Array.prototype.slice.call(arguments).join(" ")), console.log(t), e && (e.style.display = "block", e.value += t + "\n", e.scrollTop = e.scrollHeight) } }(), canvas: document.getElementById("canvas"), onRuntimeInitialized: function () { const e = document.getElementById("loadingOverlay"); e && (e.style.opacity = "0", setTimeout((() => { e.style.display = "none" }), 500)) } }; let consoleTimeout; const originalPrint = Module.print; Module.print = function (e) { originalPrint(e), clearTimeout(consoleTimeout), consoleTimeout = setTimeout((() => { const e = document.getElementById("output"); e && "" === e.value.trim() && (e.style.display = "none") }), 1e4) }</script>
        <script src=QSynth.js async></script>
    </body>

    </html>
